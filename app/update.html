<!DOCTYPE html>
<html>
  <body>
    <style>
      body {
        -webkit-app-region: drag;
        user-select: none;
        margin: 0;
        padding: 14px 16px;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        height:100%;
        background:#222;
        color:#fff;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, sans-serif;
      }

      /* Pour les éléments interactifs comme boutons (si tu en ajoutes), annule le drag : */
      button, progress {
        -webkit-app-region: no-drag;
      }

      #card {
        width: 100%;
        max-width: 520px;
      }

      #status {
        margin: 0 28px 8px 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.3;
        white-space: normal;
        word-break: break-word;
      }

      #progressBar {
        width: 100%;
        height: 12px;
        margin: 0;
      }

      #detail {
        margin: 8px 0 0;
        font-size: 12px;
        font-style: italic;
        color: #ddd;
        min-height: 32px;
        line-height: 1.35;
        white-space: normal;
        word-break: break-word;
      }
    </style>

    <button id="minimize-button" style="
      position: absolute;
      top: 5px;
      right: 5px;
      width: 24px;
      height: 24px;
      border: none;
      background: #444;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      -webkit-app-region: no-drag;
    ">_</button>


    <div id="card">
      <p id="status">Mise à jour en cours...</p>
      <progress id="progressBar" max="100" value="0"></progress>
      <p id="detail"></p>
    </div>
    <script>
      document.getElementById('minimize-button').addEventListener('click', () => {
        window.updateApi.minimize();
      });
      window.updateApi.onStatus((text) => {
        document.getElementById('status').innerText = text;
      });
      window.updateApi.onProgress((percent) => {
        document.getElementById('progressBar').value = percent;
      });
      window.updateApi.onDetail((text) => {
        document.getElementById('detail').innerText = text;
      });
      document.addEventListener('dblclick', (e) => {
        e.preventDefault();
      });
      document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });
    </script>
  </body>
</html>

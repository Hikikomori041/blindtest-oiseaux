
<div class="center" style="width: 100%;">
  <h1 style="font-size: 3.25em;">Mes listes d'oiseaux</h1>

  <div id="my-lists">
    <div id="default-list" class="list-cell">
      <div>
        <p>Tous les oiseaux</p>
        <p id="current-list-p" class="visibility-hidden">Liste actuelle</p>
      </div>
      <div>
        <button id="load-list-1-button" class="button load-button tooltip tooltip-top" data-tooltip="Charger la liste">
          <img src="../ressources/images/load-button.svg" alt="Charger la liste"/>
        </button>
      </div>
    </div>

    <div id="list-1" class="list-cell">
      <div id="list-title">
        <p>Liste 1 exemple</p>
        <p id="current-list-p">Liste actuelle</p>
      </div>
      <div>
        <button id="edit-list-1-button" class="button edit-button tooltip tooltip-top" data-tooltip="Modifier la liste">
          <img src="../ressources/images/edit-button.svg" alt="Modifier la liste"/>
        </button>
        <button id="load-list-1-button" class="button load-button tooltip tooltip-top" data-tooltip="Charger la liste">
          <img src="../ressources/images/load-button.svg" alt="Charger la liste"/>
        </button>
      </div>
    </div>

    <div id="list-2" class="list-cell">
      <div>
        <p>Liste 2 exemple long</p>
        <p id="current-list-p" class="visibility-hidden">Liste actuelle</p>
      </div>
      <div>
        <button id="edit-list-2-button" class="button edit-button tooltip tooltip-top" data-tooltip="Modifier la liste">
          <img src="../ressources/images/edit-button.svg" alt="Modifier la liste"/>
        </button>
        <button id="load-list-2-button" class="button load-button tooltip tooltip-top" data-tooltip="Charger la liste">
          <img src="../ressources/images/load-button.svg" alt="Charger la liste"/>
        </button>
      </div>
    </div>
  </div>

</div>

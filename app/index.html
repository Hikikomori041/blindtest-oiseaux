<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Blind-Test Oiseaux</title>
  <link href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="titlebar">
    <div id="drag-region">
      <span class="title">Blind-Test Oiseaux</span>
      <div id="window-controls">
        <button id="minimize">━</button>
        <button id="maximize">🗖</button>
        <button id="close">✖</button>
      </div>
    </div>
  </div>

  <div id="overlay"></div>

  <div class="columns mt-5 mx-5">
  
    <!-- Colonne gauche : types d'oiseaux -->
    <div class="column is-one-fifth">
       <section id="feedback" class="box">
        <div id="score" class="mt-3">Score: -/-</div>
      </section>
      <section id="type-selection" class="box">
        <h2 class="title is-4">Types d'oiseaux</h2>
        <label class="checkbox mr-2">
          <input type="checkbox" value="commun" checked> Communs
        </label>
        <label class="checkbox mr-2">
          <input type="checkbox" value="eau" checked> D'eau
        </label>
        <label class="checkbox">
          <input type="checkbox" value="plaine" checked> De plaine
        </label>
      </section>
    </div>

    <!-- Colonne droite : tout le reste en pile -->
    <div class="column">
      <section id="quiz" class="box">
        <h2 class="title is-4">Quel est cet oiseau ?</h2>
        <div id="bird-grid" class="grid"></div>
          <!-- <div class="cell oiseau-commun">
            <div class="columns">
              <div class="column is-one-fifth">

              </div>
              <div class="column bird-name">
                <span class="bird-name-french">Accenteur mouchet</span>
                <span class="bird-name-latin">(Prunella modularis)</span>
              </div>
            </div>
          </div>
          <div class="cell oiseau-eau">
            <div class="columns">
              <div class="column is-one-fifth">
                <img class="bird-img" src="../ressources/oiseaux/Aigrette garzette/image.jpg"/>
              </div>
              <div class="column bird-name">
                <span class="bird-name-french">Aigrette garzette</span>
                <span class="bird-name-latin">(Egretta garzetta)</span>
              </div>
            </div>
          </div>
          <div class="cell">Cell 3</div>
          <div class="cell oiseau-plaine">
            <div class="columns">
              <div class="column is-one-fifth">
                <img class="bird-img" src="../ressources/oiseaux/Alouette lulu/image.jpg"/>
              </div>
              <div class="column bird-name">
                <span class="bird-name-french">Alouette lulu</span>
                <span class="bird-name-latin">(Lullula arborea)</span>
              </div>
            </div>
          </div> -->
      </section>

     

      <div id="result-popup" class="notification is-info is-light" style="display: none; position: fixed; top: 20%; left: 50%; transform: translateX(-50%); z-index: 999; padding: 1.5rem; font-size: 1.5rem;">
        <span id="result-text"></span>
        <div id="result-bird">
          <span id="result-birdname">
            <span id="result-birdname-french"></span>
            <span id="result-birdname-latin"></span>
          </span>
          <div id="result-image"></div>
          <button id="result-next" class="button is-primary" title="Oiseau suivant">🔀 Oiseau suivant</button>
        </div>
      </div>


    </div>
  </div>

  <section id="controls" class="box">
    <div class="buttons">
      <button id="replay" class="button is-info" title="Réécouter">⏮️</button>
      <button id="rewind" class="button is-info" title="Reculer 5s">⏪</button>
      <button id="pause-button"  class="button is-info" title="Pause">⏸️</button>
      <button id="forward" class="button is-info" title="Avancer 5s">⏩</button>
      <button id="switch" class="button is-info" title="Autre son">⏭️</button>
      <!-- <button id="next" class="button is-primary" title="Oiseau suivant">🔀 Oiseau suivant</button> -->
    </div>
  </section>

  <div id="context-menu" style="display:none; position:fixed; background:#333; color:white; border-radius:5px; padding:5px 10px; z-index:9999; cursor:pointer;">
    <span id="listen-bird-button">🎧 Écouter cet oiseau</span>
    <span id="see-bird-button">🌐 Plus d'info</span>
  </div>

</div>

  <script src="main.js"></script>
  <script>
    document.getElementById('minimize').addEventListener('click', () => window.api.minimize());
    document.getElementById('maximize').addEventListener('click', () => window.api.maximize());
    document.getElementById('close').addEventListener('click', () => window.api.close());
  </script>

</body>
</html>

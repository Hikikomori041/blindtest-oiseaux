<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Blind-Test Oiseaux</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="titlebar">
    <div id="drag-region">
      <span class="title">Blind-Test Oiseaux</span>
      <div id="window-controls">
        <button id="minimize">🗕</button>
        <button id="maximize">🗖</button>
        <button id="close">✖️</button>
      </div>
    </div>
  </div>

  <div id="container">
    <section id="type-selection">
      <h2>Types d'oiseaux</h2>
      <label><input type="checkbox" value="commun" checked> Communs</label>
      <label><input type="checkbox" value="eau" checked> D'eau</label>
      <label><input type="checkbox" value="plaine" checked> De plaine</label>
    </section>

    <section id="controls">
      <button id="replay" title="Réécouter">⏮️</button>
      <button id="rewind" title="Reculer 5s">⏪</button>
      <button id="pause" title="Pause">⏸️</button>
      <button id="forward" title="Avancer 5s">⏩</button>
      <button id="switch" title="Autre son">⏭️</button>
      <button id="next" title="Oiseau suivant">🔀 Oiseau suivant</button>
    </section>

    <section id="quiz">
      <h2>Quel est cet oiseau ?</h2>
      <ul id="bird-list"></ul>
      <button id="validate">✅ Valider</button>
    </section>

    <section id="feedback">
      <div id="result"></div>
      <div id="image-container"></div>
      <div id="score">Score 0/0</div>
    </section>
  </div>

  <script src="main.js"></script>
  <script>
    document.getElementById('minimize').addEventListener('click', () => window.api.minimize());
    document.getElementById('maximize').addEventListener('click', () => window.api.maximize());
    document.getElementById('close').addEventListener('click', () => window.api.close());
  </script>

</body>
</html>

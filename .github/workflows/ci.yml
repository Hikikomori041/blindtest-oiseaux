name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'birds/**'
      - 'assets/data/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'birds/**'
      - 'assets/data/**'
      - 'scripts/**'

jobs:
  # ──────────────────────────────────────────────────
  # Job 1 : Lint + audit de sécurité (rapide, Linux)
  # ──────────────────────────────────────────────────
  lint-and-audit:
    name: Lint & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Audit de sécurité (dépendances de production uniquement)
        run: npm audit --audit-level=high --omit=dev

  # ──────────────────────────────────────────────────
  # Job 2 : Vérification du build Windows
  # ──────────────────────────────────────────────────
  build-check:
    name: Build Check (Windows)
    runs-on: windows-latest
    needs: lint-and-audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Build Electron (Windows)
        run: npm run build
        env:
          # Désactive la signature de code en CI
          CSC_IDENTITY_AUTO_DISCOVERY: false

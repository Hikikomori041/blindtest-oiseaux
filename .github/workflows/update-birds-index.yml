name: Mettre à jour birds-index.json

on:
  push:
    branches:
      - main
    paths:
      - 'birds/**'

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Régénérer birds-index.json
        run: node scripts/generate-birds-index.js

      - name: Commiter si modifié
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/birds-index.json
          if git diff --cached --quiet; then
            echo "Aucun changement significatif dans birds-index.json"
          else
            git commit -m "chore: régénérer birds-index.json"
            git push
          fi
